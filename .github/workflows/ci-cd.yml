name: Tifora CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          # These two tracked UTF-16 files are not imported runtime modules.
          find Backend \
            -path 'Backend/node_modules' -prune -o \
            -type f -name '*.js' \
            ! -path 'Backend/src/server.js' \
            ! -path '*/order-delivery-HEAD.service.js' \
            -print0 \
            | xargs -0 -n 1 node --check

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tifora.in
    concurrency:
      group: tifora-production
      cancel-in-progress: false
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tifora_deploy
          chmod 600 ~/.ssh/tifora_deploy
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull latest code and run server deploy script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/tifora_deploy -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          if [ -f "$HOME/deploy.sh" ]; then
            DEPLOY_SCRIPT="$HOME/deploy.sh"
          elif [ -f "/root/deploy.sh" ]; then
            DEPLOY_SCRIPT="/root/deploy.sh"
          else
            echo "Could not find deploy.sh in the VPS root home directory." >&2
            exit 1
          fi

          chmod +x "$DEPLOY_SCRIPT"
          "$DEPLOY_SCRIPT"
          REMOTE
